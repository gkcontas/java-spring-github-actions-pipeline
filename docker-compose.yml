# Local infrastructure only. In CI the integration tests start their own Postgres
# through Testcontainers, so this file is never used by the pipeline.

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flags
      POSTGRES_USER: flags
      POSTGRES_PASSWORD: flags
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags"]
      interval: 5s
      timeout: 3s
      retries: 10
