spring:
  application:
    name: feature-flags
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flags}
    username: ${DB_USER:flags}
    password: ${DB_PASSWORD:flags}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: simple
